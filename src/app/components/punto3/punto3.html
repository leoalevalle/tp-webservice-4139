<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-lg border-0">
        <div class="card-header">
          <h3 class="text-center mb-0">Exchange FX</h3>
        </div>
        <div class="card-body">
          <div *ngIf="loading" class="text-center">
            <div class="spinner-border text-info" role="status">
              <span class="visually-hidden">Cargando...</span>
            </div>
            <p class="mt-2 text-muted">Procesando cambio...</p>
          </div>

          <div *ngIf="error" class="alert alert-danger">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            {{ errorMessage }}
          </div>

          <form (ngSubmit)="convert()" *ngIf="!loading">
            <!-- Monto -->
            <div class="mb-4">
              <label for="amount" class="form-label small text-uppercase fw-bold text-muted">Monto a enviar</label>
              <div class="input-group input-group-lg">
                <span class="input-group-text bg-dark border-secondary text-white">$</span>
                <input type="number" class="form-control bg-dark border-secondary text-white" id="amount" 
                       [(ngModel)]="amount" name="amount" min="0" step="0.01" required>
              </div>
            </div>

            <!-- De Moneda -->
            <div class="mb-2">
              <label for="fromCurrency" class="form-label small text-uppercase fw-bold text-muted">Desde</label>
              <select class="form-select form-select-lg bg-dark border-secondary text-white" id="fromCurrency" 
                      [(ngModel)]="fromCurrency" name="fromCurrency" required>
                <option *ngFor="let currency of currencies" [value]="currency.code">
                  {{ currency.code }} - {{ currency.name }}
                </option>
              </select>
            </div>

            <!-- Botón Swap-->
            <div class="text-center my-3">
              <button type="button" class="btn btn-swap btn-sm" (click)="swapCurrencies()" title="Invertir monedas">
                <i class="bi bi-arrow-down-up"></i>
              </button>
            </div>

            <!-- A Moneda -->
            <div class="mb-4">
              <label for="toCurrency" class="form-label small text-uppercase fw-bold text-muted">Hacia</label>
              <select class="form-select form-select-lg bg-dark border-secondary text-white" id="toCurrency" 
                      [(ngModel)]="toCurrency" name="toCurrency" required>
                <option *ngFor="let currency of currencies" [value]="currency.code">
                  {{ currency.code }} - {{ currency.name }}
                </option>
              </select>
            </div>

            <button type="submit" class="btn btn-action btn-lg w-100 py-3 mb-2" [disabled]="loading">
              <span>Convertir ahora</span>
              <i class="bi bi-lightning-charge-fill ms-2"></i>
            </button>
          </form>

          <div *ngIf="result !== null && !error" class="mt-4">
            <div class="result-card p-4 rounded-4">
              <div class="text-muted small text-uppercase fw-bold mb-1">Resultado estimado</div>
              <h2 class="display-6 fw-bold text-white mb-3">
                {{ result | number:'1.2-2' }} <span class="text-info h4">{{ toCurrency }}</span>
              </h2>
              <div class="rate-info small">
                <span class="text-muted">Tasa: 1 {{ fromCurrency }} = {{ rate | number:'1.2-6' }} {{ toCurrency }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
