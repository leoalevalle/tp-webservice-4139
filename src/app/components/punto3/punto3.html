<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card">
        <div class="card-header">
          <h2 class="text-center mb-0">Conversor de Monedas</h2>
        </div>
        <div class="card-body">
          <div *ngIf="loading" class="text-center">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Cargando...</span>
            </div>
            <p>Cargando...</p>
          </div>

          <div *ngIf="error" class="alert alert-danger">
            {{ errorMessage }}
          </div>

          <form (ngSubmit)="convert()" *ngIf="!loading">
            <div class="row mb-3">
              <div class="col-md-4">
                <label for="amount" class="form-label">Monto</label>
                <input type="number" 
                       class="form-control" 
                       id="amount" 
                       [(ngModel)]="amount" 
                       name="amount" 
                       min="0" 
                       step="0.01" 
                       required>
              </div>
              <div class="col-md-3">
                <label for="fromCurrency" class="form-label">De</label>
                <select class="form-select" 
                        id="fromCurrency" 
                        [(ngModel)]="fromCurrency" 
                        name="fromCurrency" 
                        required>
                  <option *ngFor="let currency of currencies" [value]="currency.code">
                    {{ currency.code }} - {{ currency.name }}
                  </option>
                </select>
              </div>
              <div class="col-md-1 d-flex align-items-end justify-content-center">
                <button type="button" 
                        class="btn btn-outline-secondary" 
                        (click)="swapCurrencies()">
                  <i class="bi bi-arrow-left-right">revertir</i>
                </button>
              </div>
              <div class="col-md-3">
                <label for="toCurrency" class="form-label">A</label>
                <select class="form-select" 
                        id="toCurrency" 
                        [(ngModel)]="toCurrency" 
                        name="toCurrency" 
                        required>
                  <option *ngFor="let currency of currencies" [value]="currency.code">
                    {{ currency.code }} - {{ currency.name }}
                  </option>
                </select>
              </div>
              <div class="col-md-1 d-flex align-items-end">
                <button type="submit" class="btn btn-primary w-100">
                  <i class="bi bi-arrow-right">go</i>
                </button>
              </div>
            </div>
          </form>

          <div *ngIf="result !== null && !error" class="mt-4">
            <div class="alert alert-success">
              <h4 class="alert-heading">Resultado</h4>
              <p class="mb-0">
                {{ amount }} {{ fromCurrency }} = {{ result | number:'1.2-2' }} {{ toCurrency }}
              </p>
              <hr>
              <p class="mb-0">
                Tasa de cambio: 1 {{ fromCurrency }} = {{ rate | number:'1.2-6' }} {{ toCurrency }}
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
