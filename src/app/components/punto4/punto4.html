<div class="container mt-5">
  <div class="card shadow">
    <div class="card-header bg-primary text-white">
      <h3 class="mb-0">Conversor de Texto a Audio (OpenAI)</h3>
    </div>
    <div class="card-body">
      <div class="mb-3">
        <label class="form-label">Texto a convertir:</label>
        <textarea class="form-control" [(ngModel)]="texto" rows="4" placeholder="Escribe algo aquí..."></textarea>
      </div>

      <div class="row align-items-end">
        <div class="col-md-6 mb-3">
          <label class="form-label">Elegir Voz:</label>
          <select class="form-select" [(ngModel)]="vozSeleccionada">
            <option *ngFor="let voz of voces" [value]="voz.id">{{ voz.nombre }}</option>
          </select>
        </div>
        <div class="col-md-6 mb-3">
          <button class="btn btn-success w-100" (click)="convertirTextoAAudio()" [disabled]="cargando || !texto">
            <span *ngIf="cargando" class="spinner-border spinner-border-sm mr-2"></span>
            {{ cargando ? 'Generando...' : 'Convertir a Audio' }}
          </button>
        </div>
      </div>

      <div class="mt-4 text-center" [hidden]="!audioUrl">
        <hr>
        <h5>Resultado:</h5>
        <audio #audioPlayer controls [src]="audioUrl" class="w-100 mt-2">
          Tu navegador no soporta la reproducción de audio.
        </audio>
        <div class="mt-3">
          <a [href]="audioUrl" download="audio-generado.mp3" class="btn btn-outline-primary btn-sm">
            <i class="bi bi-download"></i> Descargar Audio
          </a>
          <p class="mt-2"><small class="text-muted">El audio se genera dinámicamente mediante IA.</small></p>
        </div>
      </div>
    </div>
  </div>
</div>
