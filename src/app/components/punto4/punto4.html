<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-7">
      <div class="card shadow-lg border-0">
        <div class="card-header">
          <h3 class="text-center mb-0">AI Smart Translator & Speech</h3>
        </div>
        <div class="card-body p-4">
          <div class="mb-4">
            <label for="texto" class="form-label small text-uppercase fw-bold text-muted">Texto original</label>
            <textarea name="texto" id="texto" class="form-control" rows="3" [(ngModel)]="textoOriginal" placeholder="Escriba el texto que desea traducir o convertir..."></textarea>
          </div>
          
          <div class="row mb-4">
            <div class="col-sm-8">
              <label for="idioma" class="form-label small text-uppercase fw-bold text-muted">Idioma destino</label>
              <select name="idioma" id="idioma" class="form-select" [(ngModel)]="idiomaSeleccionado">
                <option *ngFor="let lang of idiomas" [value]="lang.code">
                  {{ lang.language }}
                </option>
              </select>
            </div>
            <div class="col-sm-4 d-flex align-items-end mt-3 mt-sm-0">
              <button type="button" class="btn btn-translate w-100" (click)="traducirTexto()" [disabled]="!textoOriginal">
                <i class="bi bi-translate me-2"></i>Traducir
              </button>
            </div>
          </div>

          <div class="mb-4 result-box" *ngIf="textoTraducido">
            <label class="form-label small text-uppercase fw-bold text-accent">Traducción</label>
            <div class="p-3 translation-content rounded">
              {{ textoTraducido }}
            </div>
          </div>

          <div class="d-grid gap-3">
            <button type="button" class="btn btn-audio btn-lg" (click)="convertirAudio()" [disabled]="!textoOriginal">
              <i class="bi bi-volume-up-fill me-2"></i>Escuchar Texto
            </button>
            
            <div class="audio-container mt-2 text-center" [hidden]="!textoOriginal">
              <audio #reproductor controls class="w-100"></audio>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
